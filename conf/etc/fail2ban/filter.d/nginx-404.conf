# Fail2Ban Filter configuration file for detecting HTTP 404 responses in nginx access logs
# 
# Author: Cedric Francoys
#
# Can be tested with following command: 
# fail2ban-regex /var/log/nginx/access.log
#

[Definition]
_daemon = nginx-404

failregex = ^\S+\s+<HOST>\s+-\s+\S+\s+\[[^\]]+\]\s+"[^"]*"\s+404\s+\d+\s+"[^"]*"\s+"[^"]*"\s*$

ignoreregex =

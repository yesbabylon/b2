# Fail2Ban Filter configuration file for detecting repeated nginx-404 bans
# 
# Author: Cedric Francoys
#
# Can be tested with following command: 
# fail2ban-regex /var/log/fail2ban.log
#

[Definition]
_daemon = nginx-404-recidive

failregex = ^.*\sfail2ban\.actions\s+\[[^\]]+\]:\s+NOTICE\s+\[nginx-404\]\s+Ban\s+<HOST>\s*$

ignoreregex =

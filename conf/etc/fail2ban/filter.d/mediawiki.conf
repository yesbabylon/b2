# Fail2Ban filter for expensive MediaWiki revision requests
#
# Nginx log format:
# vhost client_ip - remote_user [date] "request" status bytes "referer" "user-agent"
#
# Test with:
# fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/mediawiki.conf

[Definition]
_daemon = mediawiki

# Match revision/diff/undo parameters on dynamic MediaWiki requests.
# The suspicious parameter may be first in the query string or follow other parameters.
# The first field is the Nginx vhost, so this filter can protect any MediaWiki host.
failregex = ^\S+\s+<HOST>\s+\S+\s+\S+\s+\[\]\s+"[A-Z]+\s+(?:https?://[^/\s]+)?/index\.php\?(?:[^"\s]*&)?(?:diff|oldid|undo|undoafter)=[^"\s]*\s+HTTP/[0-9.]+"

ignoreregex =

# Nginx's standard local timestamp is removed before failregex is evaluated.
datepattern = ^[^\[]*\[({DATE})

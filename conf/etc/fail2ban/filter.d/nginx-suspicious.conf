# Fail2Ban Filter configuration file for detecting HTTP 404, 499, 502 and 503 responses in nginx access logs
#
# Author: Cedric Francoys
#
# Can be tested with following command:
# fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/nginx-suspicious.conf
#

[Definition]
_daemon = nginx-suspicious

failregex = ^[^\s]*\s*<HOST>.*"GET\s+[^"]*"\s+404\b.*$
            ^[^\s]*\s*<HOST>.*"\S+\s+[^"]*"\s+(?:499|502|503)\b.*$

ignoreregex =

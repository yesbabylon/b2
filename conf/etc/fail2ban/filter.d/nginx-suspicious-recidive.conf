# Fail2Ban Filter configuration file for detecting repeated nginx-suspicious bans
#
# Author: Cedric Francoys
#
# Can be tested with following command:
# fail2ban-regex /var/log/fail2ban.log
#

[Definition]
_daemon = nginx-suspicious-recidive

failregex = ^.*\sfail2ban\.actions\s+\[[^\]]+\]:\s+NOTICE\s+\[nginx-suspicious\]\s+Ban\s+<HOST>\s*$

ignoreregex =

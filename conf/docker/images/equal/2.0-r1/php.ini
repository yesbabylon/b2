upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
memory_limit = 256M
zend_extension=xdebug
; uncomment to disable opcache
; opcache.enable=0

; Disable session upload progress
session.upload_progress.enabled = 0
; Restrict input complexity
max_input_vars = 1000
max_input_nesting_level = 32
max_file_uploads = 10